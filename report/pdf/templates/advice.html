{% extends "base.html" %}
{% block content %}
<div class="page-break">
    <div class="header">
        <h2 class="metric-title">{{ t.advice_title }}</h2>
    </div>

    <div style="margin-bottom: 30px;">
        <p>{{ t.advice_intro }}</p>
    </div>

    {% for item in advice_items %}
    <div class="advice-item">
        <h3 class="advice-title">{{ item.metric_name_ru }}</h3>
        <span class="advice-cat">{{ item.category }}</span>
        <p>{{ item.advice_text }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
