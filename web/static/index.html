<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Рейтинг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="title">Рейтинг</h1>
    <div id="me-chip" class="me-chip hidden"></div>
  </header>

  <div class="gender-switch" id="gender-switch">
    <button class="gender-btn active" data-gender="male">Мужчины</button>
    <button class="gender-btn" data-gender="female">Девушки</button>
  </div>

  <main id="content" class="content">
    <div id="loader" class="state">Загрузка…</div>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="global">Топ</button>
    <button class="tab" data-view="tiers">Уровни</button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
